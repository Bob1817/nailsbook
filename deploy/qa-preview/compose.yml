name: nailbook-qa-preview
services:
  backend:
    image: nailbook-qa-preview:local
    build:
      context: ../../backend
    env_file:
      - ../../.qa-local/backend.env
    volumes:
      - database:/app/data
      - uploads:/app/uploads
      - ./seed.cjs:/qa/seed.cjs:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3300:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [isolated, entry]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  database:
  uploads:
networks:
  isolated:
    internal: true
  entry:
