# =============================================================
# 全局 gzip 压缩 — 节省低带宽服务器的传输开销
# nginx:alpine 主配置 include conf.d/*.conf 在 http 块内，
# 因此此文件直接作用于 http 级别，对所有 server {} 生效。
# =============================================================

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;

# 对典型文本响应启用压缩
gzip_types
  text/plain
  text/css
  text/javascript
  text/xml
  application/json
  application/javascript
  application/xml
  application/x-javascript
  application/rss+xml
  application/atom+xml
  image/svg+xml
  font/ttf
  font/otf;
