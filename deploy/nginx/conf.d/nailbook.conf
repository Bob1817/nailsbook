# =============================================================
# HTTP-only 配置（所有子域名）
# 用于 ACME 验证和 301 重定向到 HTTPS
# SSL 证书申请完成后，对应的 -ssl.conf 文件会被启用
# =============================================================

# ---- api.lunails.cn HTTP ----
server {
    listen 80;
    server_name api.lunails.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

