server {
    listen 443 ssl;
    server_name m.lunails.cn;

    ssl_certificate     /etc/letsencrypt/live/m.lunails.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.lunails.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/m.lunails.cn/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;


    # ACME challenge for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        limit_req zone=socket_handshakes burst=10 nodelay;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass         http://client-web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
