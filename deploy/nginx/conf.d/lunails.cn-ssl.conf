# =============================================================
# 官网 lunails.cn（apex）+ www.lunails.cn HTTPS
# 启用前提：已为 lunails.cn 和 www.lunails.cn 申请到证书。
# 启用方式：去掉 .disabled 后缀，然后 docker compose restart nginx
# =============================================================

# ---- www.lunails.cn HTTPS → 301 到 apex ----
server {
    listen 443 ssl;
    server_name www.lunails.cn;

    ssl_certificate     /etc/letsencrypt/live/lunails.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunails.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lunails.cn/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lunails.cn$request_uri;
    }
}

# ---- lunails.cn HTTPS（官网） ----
server {
    listen 443 ssl;
    server_name lunails.cn;

    ssl_certificate     /etc/letsencrypt/live/lunails.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunails.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lunails.cn/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ACME challenge for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 指南区旧 slug（geo-guide）-> 线上 slug，301 永久跳转（2026-11-27，至少保留 6 个月）
    location ~ ^/guides/no-shop-how-to-get-clients/?$ { return 301 https://lunails.cn/guides/no-store-orders; }
    location ~ ^/guides/leave-salon-first-step/?$ { return 301 https://lunails.cn/guides/leave-shop-first-step; }
    location ~ ^/guides/post-works-to-get-clients/?$ { return 301 https://lunails.cn/guides/social-works-for-clients; }
    location ~ ^/guides/home-service-how-to-start/?$ { return 301 https://lunails.cn/guides/home-visit-nail-service; }
    location ~ ^/guides/avoid-double-booking/?$ { return 301 https://lunails.cn/guides/avoid-booking-conflicts; }
    location ~ ^/guides/reschedule-management/?$ { return 301 https://lunails.cn/guides/reschedule-appointments; }
    location ~ ^/guides/repeat-clients/?$ { return 301 https://lunails.cn/guides/repeat-clients-follow-up; }
    location ~ ^/guides/how-to-price/?$ { return 301 https://lunails.cn/guides/how-to-price-nails; }
    location ~ ^/guides/price-by-style/?$ { return 301 https://lunails.cn/guides/price-by-design; }
    location ~ ^/guides/professional-quote/?$ { return 301 https://lunails.cn/guides/professional-quoting; }
    location ~ ^/guides/organize-works/?$ { return 301 https://lunails.cn/guides/organize-nail-works; }
    location ~ ^/guides/online-shop-without-store/?$ { return 301 https://lunails.cn/guides/online-shop-for-artists; }
    location ~ ^/guides/salon-vs-freelance/?$ { return 301 https://lunails.cn/guides/employed-vs-independent; }
    location ~ ^/guides/go-freelance-checklist/?$ { return 301 https://lunails.cn/guides/go-independent-requirements; }
    location ~ ^/guides/daily-routine/?$ { return 301 https://lunails.cn/guides/daily-workflow; }

    location / {
        proxy_pass         http://website:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
