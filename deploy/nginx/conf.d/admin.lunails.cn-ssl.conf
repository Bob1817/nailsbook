server {
    listen 443 ssl;
    server_name admin.lunails.cn;

    ssl_certificate     /etc/letsencrypt/live/admin.lunails.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.lunails.cn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/admin.lunails.cn/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;


    # ACME challenge for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://admin-web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
