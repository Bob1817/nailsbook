# Only initial Socket.IO handshakes consume this budget; established polling
# sessions include sid and therefore use an empty (unlimited) key.
map $arg_sid $socket_handshake_key {
    "" $binary_remote_addr;
    default "";
}
limit_req_zone $socket_handshake_key zone=socket_handshakes:1m rate=10r/m;
limit_req_status 429;
