<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2920" viewBox="0 0 1800 2920">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#454545"/>
  </marker>
  <style>
    .title { font: 700 48px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#171717; }
    .subtitle { font: 400 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#666; }
    .section { font: 700 30px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#171717; }
    .box-title { font: 700 27px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#171717; }
    .box-text { font: 400 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#454545; }
    .small { font: 400 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:#666; }
    .edge { stroke:#454545; stroke-width:3; fill:none; marker-end:url(#arrow); }
    .dash { stroke:#777; stroke-width:3; stroke-dasharray:10 8; fill:none; marker-end:url(#arrow); }
  </style>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".10"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#F5F5F7"/>
<text x="900" y="76" text-anchor="middle" class="title">美甲记录与私密档案闭环</text>
<text x="900" y="118" text-anchor="middle" class="subtitle">预约 → 过程记录 → 人工确认同步 → 下次预约复用</text>
<circle cx="95" cy="181" r="28" fill="#171717"/><text x="95" y="190" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">1</text><text x="140" y="190" class="section">预约建立记录上下文</text><rect x="570" y="225" width="660" height="130" rx="24" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="2" filter="url(#shadow)"/><text x="900.0" y="268" text-anchor="middle" class="box-title">客户发起预约</text><text x="900.0" y="307" text-anchor="middle" class="box-text">预约默认关联客户，可关联一个来源作品</text><rect x="150" y="405" width="430" height="150" rx="24" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="2" filter="url(#shadow)"/><text x="365.0" y="448" text-anchor="middle" class="box-title">客户信息</text><text x="365.0" y="487" text-anchor="middle" class="box-text">客户身份、历史提醒、稳定偏好</text><rect x="685" y="405" width="430" height="150" rx="24" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="2" filter="url(#shadow)"/><text x="900.0" y="448" text-anchor="middle" class="box-title">预约上下文</text><text x="900.0" y="487" text-anchor="middle" class="box-text">时间、服务方式、服务项目</text><rect x="1220" y="405" width="430" height="150" rx="24" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="2" filter="url(#shadow)"/><text x="1435.0" y="448" text-anchor="middle" class="box-title">作品信息</text><text x="1435.0" y="487" text-anchor="middle" class="box-text">作品名称、现有制作方案</text><path d="M900,355 L900,380.0 L365,380.0 L365,405" class="edge"/><path d="M900,355 L900,405" class="edge"/><path d="M900,355 L900,380.0 L1435,380.0 L1435,405" class="edge"/><rect x="570" y="625" width="660" height="145" rx="24" fill="#EEF3F8" stroke="#C7D4E2" stroke-width="2" filter="url(#shadow)"/><text x="900.0" y="668" text-anchor="middle" class="box-title">预约详情：服务前准备</text><text x="900.0" y="707" text-anchor="middle" class="box-text">优先显示安全提醒、偏好、工具、材料和步骤</text><path d="M365,555 L365,590.0 L770,590.0 L770,625" class="edge"/><path d="M900,555 L900,625" class="edge"/><path d="M1435,555 L1435,590.0 L1030,590.0 L1030,625" class="edge"/><circle cx="95" cy="861" r="28" fill="#171717"/><text x="95" y="870" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">2</text><text x="140" y="870" class="section">按真实服务顺序记录</text><rect x="90" y="925" width="480" height="235" rx="24" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="2" filter="url(#shadow)"/><text x="330.0" y="968" text-anchor="middle" class="box-title">服务前</text><text x="330.0" y="1007" text-anchor="middle" class="box-text">甲面情况与注意事项</text><text x="330.0" y="1039" text-anchor="middle" class="box-text">临时需求</text><text x="330.0" y="1071" text-anchor="middle" class="box-text">服务前照片</text><rect x="660" y="925" width="480" height="235" rx="24" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="2" filter="url(#shadow)"/><text x="900.0" y="968" text-anchor="middle" class="box-title">服务中</text><text x="900.0" y="1007" text-anchor="middle" class="box-text">过程照片、使用工具</text><text x="900.0" y="1039" text-anchor="middle" class="box-text">材料与色号、步骤技法</text><text x="900.0" y="1071" text-anchor="middle" class="box-text">客户反应与异常</text><rect x="1230" y="925" width="480" height="235" rx="24" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="2" filter="url(#shadow)"/><text x="1470.0" y="968" text-anchor="middle" class="box-title">完成后</text><text x="1470.0" y="1007" text-anchor="middle" class="box-text">完成照片、客户反馈</text><text x="1470.0" y="1039" text-anchor="middle" class="box-text">偏好与护理建议</text><text x="1470.0" y="1071" text-anchor="middle" class="box-text">下次准备与复盘</text><path d="M570,1040 L660,1040" class="edge"/><path d="M1140,1040 L1230,1040" class="edge"/><rect x="570" y="1220" width="660" height="150" rx="24" fill="#FFFFFF" stroke="#B9BCC3" stroke-width="2" filter="url(#shadow)"/><text x="900.0" y="1263" text-anchor="middle" class="box-title">防抖自动保存</text><text x="900.0" y="1302" text-anchor="middle" class="box-text">只保存单次美甲记录</text><text x="900.0" y="1334" text-anchor="middle" class="box-text">不携带任何档案同步参数</text><path d="M330,1160 L330,1190.0 L730,1190.0 L730,1220" class="dash"/><path d="M900,1160 L900,1220" class="dash"/><path d="M1470,1160 L1470,1190.0 L1070,1190.0 L1070,1220" class="dash"/><rect x="150" y="1435" width="550" height="145" rx="24" fill="#F3F7F3" stroke="#BCCDBC" stroke-width="2" filter="url(#shadow)"/><text x="425.0" y="1478" text-anchor="middle" class="box-title">保存成功</text><text x="425.0" y="1517" text-anchor="middle" class="box-text">显示已保存，清除本机草稿</text><rect x="1100" y="1435" width="550" height="145" rx="24" fill="#FAF2F2" stroke="#D9C3C3" stroke-width="2" filter="url(#shadow)"/><text x="1375.0" y="1478" text-anchor="middle" class="box-title">保存失败</text><text x="1375.0" y="1517" text-anchor="middle" class="box-text">保留本机草稿，恢复网络后重试</text><path d="M900,1370 L900,1402.5 L425,1402.5 L425,1435" class="edge"/><path d="M900,1370 L900,1402.5 L1375,1402.5 L1375,1435" class="edge"/><circle cx="95" cy="1676" r="28" fill="#171717"/><text x="95" y="1685" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">3</text><text x="140" y="1685" class="section">生成候选，由美甲师明确确认</text><rect x="120" y="1735" width="690" height="270" rx="24" fill="#FFFFFF" stroke="#CDD2D8" stroke-width="2" filter="url(#shadow)"/><text x="465.0" y="1778" text-anchor="middle" class="box-title">客户档案候选</text><text x="465.0" y="1817" text-anchor="middle" class="box-text">稳定偏好</text><text x="465.0" y="1849" text-anchor="middle" class="box-text">沟通与需求</text><text x="465.0" y="1881" text-anchor="middle" class="box-text">不适与异常提醒</text><text x="465.0" y="1913" text-anchor="middle" class="box-text">下次服务提醒</text><rect x="990" y="1735" width="690" height="270" rx="24" fill="#FFFFFF" stroke="#CDD2D8" stroke-width="2" filter="url(#shadow)"/><text x="1335.0" y="1778" text-anchor="middle" class="box-title">作品档案候选</text><text x="1335.0" y="1817" text-anchor="middle" class="box-text">工具与材料色号</text><text x="1335.0" y="1849" text-anchor="middle" class="box-text">制作步骤与技法</text><text x="1335.0" y="1881" text-anchor="middle" class="box-text">实际服务时长</text><text x="1335.0" y="1913" text-anchor="middle" class="box-text">与当前方案的差异</text><path d="M425,1580 L425,1657.5 L465,1657.5 L465,1735" class="edge"/><path d="M1375,1580 L1375,1657.5 L1335,1657.5 L1335,1735" class="edge"/><rect x="120" y="2070" width="690" height="155" rx="24" fill="#EEF3F8" stroke="#C7D4E2" stroke-width="2" filter="url(#shadow)"/><text x="465.0" y="2113" text-anchor="middle" class="box-title">手动选择客户候选</text><text x="465.0" y="2152" text-anchor="middle" class="box-text">未选择的内容只留在本次记录中</text><rect x="990" y="2070" width="690" height="155" rx="24" fill="#EEF3F8" stroke="#C7D4E2" stroke-width="2" filter="url(#shadow)"/><text x="1335.0" y="2113" text-anchor="middle" class="box-title">手动开启作品同步</text><text x="1335.0" y="2152" text-anchor="middle" class="box-text">没有关联作品时可创建作品草稿</text><path d="M465,2005 L465,2070" class="edge"/><path d="M1335,2005 L1335,2070" class="edge"/><circle cx="95" cy="2331" r="28" fill="#171717"/><text x="95" y="2340" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">4</text><text x="140" y="2340" class="section">同步结果与后续复用</text><rect x="100" y="2390" width="500" height="190" rx="24" fill="#F3F7F3" stroke="#BCCDBC" stroke-width="2" filter="url(#shadow)"/><text x="350.0" y="2433" text-anchor="middle" class="box-title">客户私密档案</text><text x="350.0" y="2472" text-anchor="middle" class="box-text">同内容不重复创建</text><text x="350.0" y="2504" text-anchor="middle" class="box-text">更新确认次数和确认时间</text><text x="350.0" y="2536" text-anchor="middle" class="box-text">仅当前美甲师可见</text><rect x="650" y="2390" width="500" height="190" rx="24" fill="#FFFFFF" stroke="#CDD2D8" stroke-width="2" filter="url(#shadow)"/><text x="900.0" y="2433" text-anchor="middle" class="box-title">美甲记录详情</text><text x="900.0" y="2472" text-anchor="middle" class="box-text">连续展示美甲记录</text><text x="900.0" y="2504" text-anchor="middle" class="box-text">客户档案状态</text><text x="900.0" y="2536" text-anchor="middle" class="box-text">作品档案状态</text><rect x="1200" y="2390" width="500" height="190" rx="24" fill="#F3F7F3" stroke="#BCCDBC" stroke-width="2" filter="url(#shadow)"/><text x="1450.0" y="2433" text-anchor="middle" class="box-title">作品私密档案</text><text x="1450.0" y="2472" text-anchor="middle" class="box-text">方案版本递增</text><text x="1450.0" y="2504" text-anchor="middle" class="box-text">保存修订快照</text><text x="1450.0" y="2536" text-anchor="middle" class="box-text">仅当前美甲师可见</text><path d="M465,2225 L465,2307.5 L350,2307.5 L350,2390" class="edge"/><path d="M1335,2225 L1335,2307.5 L1450,2307.5 L1450,2390" class="edge"/><path d="M465,2225 L465,2307.5 L900,2307.5 L900,2390" class="edge"/><path d="M1335,2225 L1335,2307.5 L900,2307.5 L900,2390" class="edge"/><rect x="505" y="2670" width="790" height="145" rx="24" fill="#171717" stroke="#171717" stroke-width="2" filter="url(#shadow)"/><text x="900.0" y="2713" text-anchor="middle" class="box-title">下一次预约再次读取已确认档案</text><text x="900.0" y="2752" text-anchor="middle" class="box-text">未手动同步的历史内容不会进入服务前准备</text><rect x="505" y="2670" width="790" height="145" rx="24" fill="#171717"/><text x="900" y="2720" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#fff">下一次预约再次读取已确认档案</text><text x="900" y="2762" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#E8E8E8">未手动同步的历史内容不会进入服务前准备</text><path d="M350,2580 L350,2625.0 L720,2625.0 L720,2670" class="edge"/><path d="M1450,2580 L1450,2625.0 L1080,2625.0 L1080,2670" class="edge"/><path d="M900,2815 L900,2860 L1740,2860 L1740,700 L1230,700" class="dash"/><text x="1250" y="2895" class="small">隐私边界：客户、其他美甲师和公开接口均不可读取私密档案</text></svg>