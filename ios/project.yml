name: NailBook
options:
  bundleIdPrefix: cn.lunails
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: NailBook/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    PRODUCT_BUNDLE_IDENTIFIER: cn.lunails.nailbook
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: "16.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"

targets:
  NailBook:
    type: application
    platform: iOS
    sources:
      - path: NailBook
    resources:
      - path: NailBook/Resources
    dependencies:
      - package: SocketIO
      - package: KeychainAccess
    settings:
      base:
        INFOPLIST_FILE: NailBook/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: cn.lunails.nailbook
