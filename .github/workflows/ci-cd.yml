name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test -- --runInBand
        env:
          DATABASE_URL: file:./test.db
          ADMIN_JWT_SECRET: ci-test-admin-secret-not-for-production
          TECHNICIAN_JWT_SECRET: ci-test-technician-secret-not-for-production
          CLIENT_JWT_SECRET: ci-test-client-secret-not-for-production
          JWT_EXPIRES_IN: 1h
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin-frontend
          - client-frontend
          - technician-frontend
          - landing-frontend
          - website
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run build

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Test website
        working-directory: website
        run: |
          npm ci
          npm run test:run

      - name: Verify mini program release gate
        working-directory: client-wxapp
        run: node scripts/release-gate.js

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test Flutter app
        working-directory: mobile-flutter
        run: |
          flutter pub get
          flutter test

  admin-image:
    needs: [backend, frontend, release-gates, proxy-soak]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bob1817/nailsbook-admin-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          file: ./admin-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-image:
    needs: [backend, frontend, release-gates, proxy-soak]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bob1817/nailsbook-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  proxy-soak:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated Nginx and backend for ten minutes
        run: bash deploy/qa-p0/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-proxy-soak
          path: deploy/qa-p0/artifacts/
