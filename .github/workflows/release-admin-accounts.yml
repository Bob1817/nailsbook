name: Release admin accounts services

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Full commit SHA, branch, or tag to release
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/bob1817/nailsbook-backend
  ADMIN_IMAGE: ghcr.io/bob1817/nailsbook-admin-web

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-frontend/package-lock.json
      - name: Verify backend account management
        working-directory: backend
        env:
          DATABASE_URL: file:./test.db
          ADMIN_JWT_SECRET: release-test-admin-secret-not-for-production
          TECHNICIAN_JWT_SECRET: release-test-technician-secret-not-for-production
          CLIENT_JWT_SECRET: release-test-client-secret-not-for-production
          JWT_EXPIRES_IN: 1h
        run: |
          npm ci
          npm test -- --runInBand admin-users.contract-spec admin-authorization.contract-spec jwt-auth.guard.spec development-auth-seed.service.spec
          npm run check:schema-drift
          npm run build
      - name: Verify admin frontend
        working-directory: admin-frontend
        run: |
          npm ci
          npm run lint
          npm run build

  backend-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:sha-${{ needs.verify.outputs.release_sha }}
          cache-from: type=gha,scope=admin-accounts-backend
          cache-to: type=gha,mode=max,scope=admin-accounts-backend

  admin-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          file: ./admin-frontend/Dockerfile
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:sha-${{ needs.verify.outputs.release_sha }}
          cache-from: type=gha,scope=admin-accounts-admin
          cache-to: type=gha,mode=max,scope=admin-accounts-admin
