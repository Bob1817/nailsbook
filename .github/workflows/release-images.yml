name: Release images from ref

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Branch, tag, or full commit SHA to build
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/bob1817/nailsbook-backend
  ADMIN_IMAGE: ghcr.io/bob1817/nailsbook-admin-web

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - id: release
        name: Resolve immutable release SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-frontend/package-lock.json
            client-frontend/package-lock.json
            technician-frontend/package-lock.json
            landing-frontend/package-lock.json
            website/package-lock.json

      - name: Verify backend
        working-directory: backend
        env:
          DATABASE_URL: file:./test.db
          ADMIN_JWT_SECRET: release-test-admin-secret-not-for-production
          TECHNICIAN_JWT_SECRET: release-test-technician-secret-not-for-production
          CLIENT_JWT_SECRET: release-test-client-secret-not-for-production
          JWT_EXPIRES_IN: 1h
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

      - name: Verify admin frontend
        working-directory: admin-frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify remaining web frontends
        run: |
          for app in client-frontend technician-frontend landing-frontend website; do
            npm ci --prefix "$app"
            npm run build --prefix "$app"
          done

      - name: Test website
        working-directory: website
        run: npm run test:run

      - name: Verify mini program release gate
        working-directory: client-wxapp
        run: node scripts/release-gate.js

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test Flutter app
        working-directory: mobile-flutter
        run: |
          flutter pub get
          flutter test

      - name: Verify isolated Nginx and backend for ten minutes
        run: bash deploy/qa-p0/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-release-verification
          path: deploy/qa-p0/artifacts/

  backend-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:sha-${{ needs.verify.outputs.release_sha }}
          cache-from: type=gha,scope=manual-backend
          cache-to: type=gha,mode=max,scope=manual-backend

  admin-image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          file: ./admin-frontend/Dockerfile
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:sha-${{ needs.verify.outputs.release_sha }}
          cache-from: type=gha,scope=manual-admin
          cache-to: type=gha,mode=max,scope=manual-admin
