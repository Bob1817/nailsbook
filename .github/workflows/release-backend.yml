name: Release backend
on:
  push:
    branches: [codex/backend-profile-name-release]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify backend
        working-directory: backend
        env:
          DATABASE_URL: file:./test.db
          ADMIN_JWT_SECRET: ci-test-admin-secret-not-for-production
          TECHNICIAN_JWT_SECRET: ci-test-technician-secret-not-for-production
          CLIENT_JWT_SECRET: ci-test-client-secret-not-for-production
        run: |
          npm ci
          npm run check:schema-drift
          npm test -- --runInBand src/client-auth/client-auth.display-name.spec.ts src/client-auth/client-auth.service.spec.ts src/client-auth/client-auth.controller.spec.ts
          npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/bob1817/nailsbook-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=manual-backend
          cache-to: type=gha,mode=max,scope=manual-backend
