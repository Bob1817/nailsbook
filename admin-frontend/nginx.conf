# Internal static server for the admin WebApp (SPA).
# The edge nginx (deploy/nginx) terminates TLS for admin.lunails.cn and proxies
# / to this container, and /api/ to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
