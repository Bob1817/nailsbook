services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: ./backend/.env.production
    volumes:
      - backend_db:/app/data
      # 图片存储已迁移到阿里云 OSS，不再需要 uploads volume
    expose:
      - "3000"
    ports:
      - "3001:3000"
    networks:
      - internal

  # 用户端 WebApp（静态 SPA，内部 nginx 提供；边缘 nginx 反代 m.lunails.cn）
  client-web:
    build:
      context: ./client-frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - client-web
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  backend_db:
  certbot_www:
  certbot_certs:

networks:
  internal:
